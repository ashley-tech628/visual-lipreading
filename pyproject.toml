[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-lipreading"
version = "1.0.0"
description = "Reproducible visual word recognition with dense 3D features and temporal modeling"
requires-python = ">=3.10"
authors = [{name = "Xinying Liu (Ashley Liu)"}]
dependencies = ["torch>=2.2,<3", "numpy>=1.26,<3", "Pillow>=10,<13"]

[project.scripts]
lipreading = "lipreading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lipreading = ["web/*.html"]
