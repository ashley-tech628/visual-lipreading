<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">Visual lipreading architecture</title><desc id="desc">Mouth images feed dense 3D and LipNet branches, feature alignment and concatenation, bidirectional recurrence, temporal aggregation and word prediction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7795b4"/></marker></defs>
<rect width="1280" height="650" rx="16" fill="#0e1728"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e9eff8">
<text x="52" y="65" font-size="14" letter-spacing="3" fill="#83e4c2">VISUAL LIPREADING / XINYING LIU</text><text x="52" y="111" font-size="34" font-weight="700">Dense 3D–LipNet feature fusion</text><text x="52" y="148" font-size="18" fill="#a5b8d1">Preserve motion, combine complementary features, aggregate valid timesteps.</text>
<g stroke="#7795b4" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M260 323H300V255H339"/><path d="M260 323H300V433H339"/><path d="M589 255H635V324H679"/><path d="M589 433H635V324H679"/><path d="M951 324H1005"/></g>
<g fill="#192840" stroke="#34516f" stroke-width="1.5"><rect x="52" y="250" width="208" height="147" rx="8"/><rect x="340" y="202" width="250" height="114" rx="8"/><rect x="340" y="375" width="250" height="114" rx="8"/><rect x="680" y="248" width="272" height="152" rx="8"/><rect x="1005" y="248" width="225" height="152" rx="8"/></g>
<text x="75" y="284" font-size="20" font-weight="700">Mouth sequence</text><text x="75" y="317" font-size="16" fill="#a5b8d1">ROI · grayscale · resize</text><text x="75" y="345" font-size="16" fill="#a5b8d1">temporal sampling</text><text x="75" y="373" font-size="16" fill="#83e4c2">B × C × T × H × W</text>
<text x="361" y="237" font-size="20" font-weight="700">3D DenseNet</text><text x="361" y="267" font-size="16" fill="#a5b8d1">dense feature reuse</text><text x="361" y="294" font-size="16" fill="#a5b8d1">spatiotemporal convolution</text>
<text x="361" y="410" font-size="20" font-weight="700">LipNet-style encoder</text><text x="361" y="439" font-size="16" fill="#a5b8d1">three STCNN stages</text><text x="361" y="466" font-size="16" fill="#a5b8d1">local mouth dynamics</text>
<text x="703" y="281" font-size="20" font-weight="700">Feature fusion</text><text x="703" y="311" font-size="16" fill="#a5b8d1">spatial alignment + concat</text><text x="703" y="339" font-size="16" fill="#a5b8d1">1 × 1 × 1 projection</text><text x="703" y="367" font-size="16" fill="#83e4c2">global spatial pooling</text>
<text x="1027" y="281" font-size="20" font-weight="700">Temporal recognition</text><text x="1027" y="312" font-size="16" fill="#a5b8d1">2-layer BiGRU / BiLSTM</text><text x="1027" y="340" font-size="16" fill="#a5b8d1">masked aggregation</text><text x="1027" y="368" font-size="16" fill="#83e4c2">word logits → top-3</text>
<path d="M52 547H1230" stroke="#34516f"/><text x="52" y="584" font-size="17" fill="#a5b8d1">One vocabulary across splits</text><text x="433" y="584" font-size="17" fill="#a5b8d1">Length-aware recurrent packing</text><text x="858" y="584" font-size="17" fill="#a5b8d1">Bundled model + preprocessing</text>
</g></svg>
